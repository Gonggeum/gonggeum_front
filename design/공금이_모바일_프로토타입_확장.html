.layout{max-width:1120px;margin:auto;display:grid;min-width:0}.layout main{min-width:0;padding:22px 16px calc(105px + env(safe-area-inset-bottom))}.nav{position:fixed;inset:auto 0 0;display:flex;background:white;border-top:1px solid var(--line);z-index:2;padding:6px 4px max(6px,env(safe-area-inset-bottom))}.nav button{flex:1;min-width:0;white-space:nowrap;padding:6px 1px;border:0;font-size:12px}.nav .active{background:var(--pale);color:var(--blue)}
h1,h2,p{margin:0}h1{font-size:26px;line-height:1.25;letter-spacing:-.045em}h2{font-size:16px;letter-spacing:-.025em}p{margin-top:7px}.heading{margin-bottom:18px}.muted,small{color:var(--muted)}small{font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:6px;padding:17px;min-width:0}.stack{display:grid;gap:14px}.section{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.balance{background:#122d57;color:white;border-color:#122d57}.balance small{color:#d1def5}.amount{font-size:clamp(28px,8vw,42px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin:4px 0 12px}.amount span{font-size:17px}.balance .primary{background:#dae8ff;color:#153a76}.rows{margin-top:8px}.row{width:100%;border:0;border-top:1px solid #e2e8f0;border-radius:0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 0;background:white}.row small{display:block;font-weight:400}.row strong{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}.income{color:#155343}.notice{background:#eaf1ff;border-left:3px solid var(--blue);padding:10px 12px;margin-bottom:12px;overflow-wrap:anywhere}.warn{background:#fff4df;border-color:#a8670c}.error{background:#fff0ef;border-color:#ae3931;color:#852a25}.field{display:grid;gap:4px;min-width:0;font-weight:700;font-size:14px}input:not([type=radio],[type=checkbox]),select,textarea{min-width:0;width:100%;max-width:100%;min-height:44px;border:1px solid #aebdce;border-radius:4px;padding:8px;background:white}textarea{min-height:75px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices label{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:4px}fieldset{min-width:0;border:0;padding:0;margin:0}legend{font-weight:700;padding:0}.keyval{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #e2e8f0}.keyval b{text-align:right;overflow-wrap:anywhere}.login{max-width:440px;margin:5vh auto 0}.tag{display:inline-block;background:var(--pale);color:#234c92;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:700}.placeholder{height:18px;background:#e7edf5;margin:12px 0;border-radius:3px}.placeholder.short{width:60%}progress{width:100%;accent-color:var(--blue)}dialog{width:min(450px,calc(100% - 28px));border:1px solid var(--line);border-radius:8px;padding:18px;color:var(--ink)}dialog::backdrop{background:#10233b77}
@media(max-width:799px){main input,main select,main textarea{font-size:16px}.bar{padding-top:max(6px,env(safe-area-inset-top))}.nav{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}}
@media(max-width:360px){.two{grid-template-columns:minmax(0,1fr)}}
@media(min-width:800px){.layout.with-nav{grid-template-columns:186px minmax(0,1fr)}.nav{position:static;align-self:start;display:grid;margin:26px 0 0 16px;padding:8px;border:1px solid var(--line);border-radius:6px}.nav button{text-align:left;padding-left:13px;font-size:14px}.layout main{padding:28px 26px 65px}.columns{display:grid;grid-template-columns:minmax(0, .85fr) minmax(0,1.15fr);gap:16px;align-items:start}.card{padding:20px}.form-width{max-width:700px}}
/* Shared ledger surfaces */
:root{background:#fbfcfd;--ink:#182838;--muted:#506375;--line:#d6dfe7;--blue:#174b9c;--pale:#e8f0fc;color:var(--ink)}
::selection{color:#102f62;background:#d5e5ff}
input,textarea{caret-color:var(--blue);scroll-margin:20px 0 100px}
button{border-radius:5px;font-size:14px}
.bar{min-height:58px}
.review{background:#f1f5f9;border-bottom:1px solid #e3e9f0}
.review summary{padding:8px 0}
.layout main{padding-top:22px}
.heading{margin-bottom:19px}
.heading-line{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
h1{font-size:25px;letter-spacing:-.025em;overflow-wrap:anywhere}
.screen-id{color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
.heading p{margin-top:4px}
.nav button{font-weight:650}
.nav .active{font-weight:800}
.notice{border:1px solid #aac1e7;border-radius:5px}
.notice.warn{border-color:#d5ac67}
.notice.error{border-color:#d79f9c}
.ledger-sheet{padding:15px 0 0;min-width:0;border-top:1px solid var(--line)}
.balance{background:#edf3fc;color:var(--ink);border:1px solid #cbd9ed;border-radius:12px;padding:18px}
.balance small{color:#364e6c}
.amount{letter-spacing:-.025em}
.balance .amount{margin:2px 0 12px;font-size:clamp(28px,9vw,43px);color:#173558}
.balance .actions{margin-top:11px}
.balance .primary{background:var(--blue);color:#fff}
.balance .primary:hover:not(:disabled){background:#143b7a;color:#fff}
.balance .receipt{color:var(--blue);background:#fff;border-color:#b5c8e5}
.row{min-height:58px;background:transparent;padding:9px 3px}
.row strong{font-size:15px}
.row span{min-width:0;overflow-wrap:anywhere}
.row small{margin-top:2px}
#filters,#transaction{background:transparent;border:0;padding:0}
#filters{gap:8px}
#filters .query-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
#filters .query-line button{min-width:60px}
#filters .actions,#transaction .actions{margin-top:0}
#filters .choices label{padding:0 9px}
#filters .choices input{accent-color:var(--blue)}
.disclosure{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 2px}
.disclosure summary{min-height:44px;padding:10px 0;font-weight:700}
.disclosure-body{display:grid;gap:10px;padding-bottom:12px}
.filter-disclosure{border-bottom:0}
.filter-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.filter-summary .quiet{padding-inline:8px}
.results .totals{display:flex;flex-wrap:wrap;column-gap:18px;row-gap:4px;margin:5px 0 8px;font-size:13px;color:var(--muted)}
.results .totals b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.results .rows{margin-top:0}
#transaction{gap:13px}
#transaction .form-actions button:first-child{flex:1}
#transaction .form-actions button:last-child{min-width:72px}
#transaction .form-actions{display:flex;gap:8px}
#filter-error:empty,#form-error:empty,#budget-error:empty{display:none}
@media(min-width:800px){.balance{padding:22px}.layout main{padding-top:27px}.results{padding-top:0;border-top:0}}


.context-actions{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap}
.context-actions button{padding-inline:7px}
.calendar-toolbar,.tab-strip{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:10px 0}
.date-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:3px}
.date-grid button{padding:0;min-height:44px;border:0;position:relative}
.date-grid button.has-trade::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;position:absolute;left:calc(50% - 2px);bottom:6px}
.date-grid button[aria-pressed=true],.tab-strip button[aria-pressed=true]{background:var(--pale);color:var(--blue);font-weight:800}
.tab-strip button{flex:1;padding-inline:6px}
.totals-line,.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ledger-meter progress{display:block;height:8px;margin:4px 0 8px}
.compact-form{margin-top:12px}
.compact-form button{justify-self:start}
.inline-error:empty{display:none}
.check-line{min-height:44px;display:flex;align-items:center;gap:5px}
.check-line input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.evidence-card{padding:9px;min-width:0}
.evidence-view{display:block;width:100%;padding:0;background:#eef1f5;border:1px solid var(--line);overflow:hidden}
.receipt-paper{min-width:0;display:grid;text-align:left;gap:7px;max-width:300px;margin:10px auto;background:#fcfcf9;border:1px solid #d8deda;padding:12px;overflow-wrap:anywhere}
.receipt-paper span{color:var(--muted);font-size:12px}
.receipt-paper strong{font-variant-numeric:tabular-nums}
.evidence-view .receipt-paper{margin:7px}
.evidence-caption{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:2px;margin-top:3px}
.evidence-caption small{font-size:11px}
.evidence-card>.quiet{width:100%;padding-inline:2px}
.notice-list{padding-top:0}
.notification-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.notification-row .row{display:block;border:0}
.new-mark{color:var(--blue);font-size:11px}
.code-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;list-style:none;padding:0;font-variant-numeric:tabular-nums}
</style>
<header><div class="bar"><span class="brand"><span class="logo" aria-hidden="true">공</span> 공금이</span><div id="context"></div></div></header>
<details class="review"><summary>시안 검토 도구 · 예시 데이터</summary><div class="tools">
<label>앱 시작<select id="scenario"><option value="first">첫 로그인</option><option value="last">마지막 장부 복원</option><option value="none">팀 없음</option><option value="noledger">장부 없음</option><option value="lost">마지막 장부 접근 불가</option><option value="invalid">세션 무효</option><option value="offline">복원 통신 실패</option></select></label>
<label>장부 권한<select id="role"><option value="admin">총무</option><option value="member">참여자</option><option value="locked">잠금 · 총무</option></select></label>
<label>목표 예산<select id="preset"><option value="unset">미설정</option><option value="zero">0원 · 경고</option><option value="warn">500,000원 · 경고</option><option value="block">500,000원 · 차단</option></select></label>
<label>조회 상태<select id="view"><option value="normal">기본</option><option value="loading">로딩</option><option value="empty">빈 결과</option><option value="error">조회 실패</option><option value="forbidden">접근 불가</option></select></label>
<button id="restart" type="button">앱 다시 열기</button></div></details>
<div class="layout"><nav class="nav" aria-label="장부 메뉴" hidden></nav><main id="screen"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
const $ = id => document.getElementById(id);
const screen = $('screen');
const dialog = $('dialog');
const categories = ['홍보비','소모품비','공간비','운영비','기타'];
const incomeTypes = ['초기 공금','이월','지원금','기부금','기타'];
const starting = [
  {id:1, type:'out', name:'포스터 인쇄', amount:120000, date:'2026-11-10', category:'홍보비', author:'김지우'},
  {id:2, type:'out', name:'설치 자재', amount:98000, date:'2026-11-09', category:'소모품비', author:'이하늘'},
  {id:3, type:'out', name:'전시장 대관', amount:252000, date:'2026-11-08', category:'공간비', author:'김지우'},
  {id:4, type:'in', name:'초기 공금', amount:1500000, date:'2026-11-06', category:'초기 공금', author:'김지우'}
];
let transactions = starting.map(t => ({...t}));
let budget = {target:null,policy:'WARN',warning:true,critical:true};
let budgetHistory = [];
let page = 'start', caller = '01', selected = null, filters = {}, previous = null;
let context = 'first', authMessage = '', formType = 'out', formCaller = '01', serial = 5;
let pickerCaller = null, listScroll = 0, budgetEditing = false, startAttempt = 0;
const role = () => $('role').value;
const locked = () => role() === 'locked';
const admin = () => role() !== 'member';
const editable = () => admin() && !locked();
const writable = () => !locked() && selected && (admin() || selected.type === 'out' && selected.author === '이하늘');
const money = n => Number(n).toLocaleString('ko-KR') + '원';
const spent = () => transactions.filter(t=>t.type==='out').reduce((sum,t)=>sum+t.amount,0);
const incoming = () => transactions.filter(t=>t.type==='in').reduce((sum,t)=>sum+t.amount,0);
const safe = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn = (label, action, style='', disabled=false) => `<button type="button" class="${style}" data-act="${action}" ${disabled?'disabled':''}>${label}</button>`;
const head = (id,title,desc='') => `<div class="heading"><div class="heading-line"><h1 tabindex="-1">${title}</h1><span class="screen-id">${id}</span></div>${desc?'<p class="muted">'+desc+'</p>':''}</div>`;
const notice = (message, style='') => `<div class="notice ${style}" role="status">${message}</div>`;
const field = (label,name,type='text',value='',extra='') => `<label class="field">${label}<input name="${name}" type="${type}" value="${safe(value)}" ${extra}></label>`;
const select = (label,name,values,value='',blank='') => `<label class="field">${label}<select name="${name}">${blank?'<option value="">'+blank+'</option>':''}${values.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select></label>`;
const kv = (k,v) => `<div class="keyval"><span>${k}</span><b>${safe(v)}</b></div>`;
const actions = (...buttons) => '<div class="actions">'+buttons.join('')+'</div>';
const lockNotice = () => locked()?notice('마감된 장부입니다. 거래와 목표 예산은 조회할 수 있습니다.','warn'):'';
const rows = list => list.length?'<div class="rows">'+list.map(t=>`<button type="button" class="row" data-act="tx:${t.id}"><span>${safe(t.name)}<small>${t.date} · ${safe(t.category)} · ${safe(t.author)}</small></span><strong class="${t.type==='in'?'income':''}">${t.type==='in'?'+':'−'}${money(t.amount)}</strong></button>`).join('')+'</div>':'<p class="muted">표시할 거래가 없습니다.</p>';
const outside = (id,title) => head(id,title)+notice('이 화면은 이동 위치만 연결했습니다. 세부 시안은 다음 검토 범위입니다.')+btn('돌아가기','back');
function go(next) {
  if(next==='00') pickerCaller=['01','02','03','04','05','07','08','11'].includes(page)?page:null;
  if(page==='10' && next!=='10')manualDraft=null;
  page = next;
  const hash=routePaths[next]||'';
  history.replaceState(null,'',location.pathname+location.search+(hash?'#'+hash:''));
  $('view').value = 'normal';
  render();
  window.scrollTo(0,next==='02'?listScroll:next==='11'?galleryScroll:0);
  screen.querySelector('h1')?.focus({preventScroll:true});
}
function openSub(next) {
  if(routePaths[next]||next==='12-invite'){enterExtension(next);return;}
  previous=page;go(next);
}
function enter() {
  if(pendingRoute && !['none','noledger','lost'].includes(context)){
    const destination=pendingRoute;pendingRoute=null;returnTo[destination]='01';go(destination);return;
  }
  pendingRoute=null;
  if (context==='last') go('01');
  else go('00');
}
function startup(retry=false) {
  const attempt=++startAttempt;
  authMessage='';
  context=$('scenario').value;
  go('start');
  setTimeout(()=>{
    if (page!=='start' || attempt!==startAttempt) return;
    if (context==='offline' && !retry) { go('offline'); return; }
    if (['last','none','noledger','lost','offline'].includes(context)) { enter(); return; }
    if (context==='invalid') authMessage='로그인 세션이 만료되었습니다. 다시 로그인해 주세요.';
    go('06');
  },650);
}
function modal(title,html,confirm,label='확인') {
  dialog.innerHTML=`<h2 id="dialog-title">${title}</h2>${html}`+
    actions('<button type="button" data-dialog="cancel" autofocus>취소</button>',confirm?`<button class="primary" type="button" data-dialog="confirm">${label}</button>`:'');
  dialog.querySelector('[data-dialog=cancel]').onclick=()=>dialog.close();
  const button=dialog.querySelector('[data-dialog=confirm]');
  if(button) button.onclick=()=>{dialog.close();confirm();};
  dialog.showModal();
}
function setPreset() {
  const preset=$('preset').value;
  budget={target:{unset:null,zero:0,warn:500000,block:500000}[preset],policy:preset==='block'?'BLOCK':'WARN',warning:true,critical:true};
  budgetHistory=[];
}
function loginPage() {
  return `<section class="login card">${head('06 · 인증','로그인','팀의 거래 기록과 잔액을 확인하세요.')}
  ${authMessage?notice(authMessage,'warn'):''}
  <form id="login" class="stack">
  ${field('아이디 또는 이메일','identifier','text','','required maxlength="254" autocomplete="username"')}
  ${field('비밀번호','password','password','','required autocomplete="current-password"')}
  <button class="primary">로그인</button><small>시안에서는 임의의 값을 입력해 진행할 수 있습니다.</small></form>
  ${actions(btn('비밀번호 찾기','sub:06-reset','quiet'),btn('회원가입','sub:06-join','quiet'))}</section>`;
}
function picker() {
  const noTeam=context==='none', noLedger=context==='noledger';
  return (pickerCaller?btn('← 장부로 돌아가기','picker-back','quiet'):'')+head('00 · 장부 선택','팀·장부 선택','장부를 열어 기록을 확인하세요.')+
  (context==='lost'?notice('마지막 장부에 접근할 수 없습니다. 이용 가능한 장부를 선택해 주세요.','warn'):'')+
  `<div class="stack form-width"><section class="card">${noTeam?'<h2>소속 팀이 없습니다</h2><p class="muted">팀을 만들거나 받은 초대를 확인하세요.</p>':
  '<label class="field">팀<select aria-label="팀"><option>모아 기획팀</option></select></label>'}
  ${actions(btn('팀 만들기','sub:07-team'),btn('초대 확인','sub:12-invite','quiet'))}</section>
  ${noTeam?'':`<section class="card"><h2>참여 장부</h2>${noLedger?'<p class="muted">참여 중인 장부가 없습니다.</p>'+actions(admin()?btn('장부 만들기','sub:07-ledger','primary'):'',btn('참여 가능한 장부 보기','sub:00-public')):'<button type="button" class="row" data-act="go:01"><span>가을 전시 준비<small>'+ (locked()?'마감 · 조회 가능':'운영 중')+'</small></span><span aria-hidden="true">›</span></button>'}</section>`}
  ${inviteState==='accepted'?'<section class="card"><h2>운영 준비팀</h2><p>초대를 수락했습니다. 참여 장부가 없습니다.</p></section>':''}
  ${actions(btn('내 계정','sub:13','quiet'))}</div>`;
}
function home() {

function extensionSubmit(form){
  const d=new FormData(form);
  const options=Object.fromEntries(d);
  const error=message=>{form.querySelector('.inline-error').innerHTML=notice(message,'error');};
  switch(form.id){
    case 'settlement-form':
    case 'gallery-filter':
      if(options.from&&options.to&&options.from>options.to){error('종료일은 시작일과 같거나 이후여야 합니다.');return;}
      if(form.id==='settlement-form')startJob('08',{...options,records:transactions.slice()});
      else {galleryFilters=options;evidenceSelection.clear();render();}
      break;
    case 'ocr-upload': {
      const file=form.elements.image.files[0]||form.elements.camera.files[0];
      if(!file||!/\.(jpe?g|png|heic|heif)$/i.test(file.name)||file.size>10*1024*1024){error('10MB 이하의 JPG, PNG 또는 HEIC 파일을 선택해 주세요.');return;}
      beginOcr(file.name);break;
    }
    case 'ocr-review': {
      if(locked()||ocr.stage!=='review')return;
      const draft=ocrValues();
      const files=[ocr.name,...Array.from(form.elements.files.files,f=>f.name)];
      const record={id:serial,type:'out',name:draft.merchant.trim(),category:draft.category,date:draft.date,amount:Number(draft.amount),author:admin()?'김지우':'이하늘',files};
      if(!record.name||files.length>5){$('form-error').innerHTML=notice('거래처와 첨부 개수를 확인해 주세요.','error');return;}
      saveTransaction(record,null,returnTo['09']||'01',()=>{
        ocr={stage:'choose'};
        evidence.push({id:Math.max(...evidence.map(item=>item.id),0)+1,tx:record.id,type:'영수증',label:'등록한 영수증',number:'•••• 0421'});
      });
      break;
    }
    case 'otp-form':
      if(options.code!=='123456'){error('예시 인증 코드 123456을 입력해 주세요.');return;}
      twoFactor=true;otpSetup=false;render();recovery();break;
    case 'lock-form':
      autoLock=options.delay;accountMessage='자동 잠금 설정을 저장했습니다.';render();break;
    case 'preferences-form':
      if(d.has('quiet')&&(!options.from||!options.to||options.from===options.to)){error('방해 금지 시작과 종료 시간을 서로 다르게 입력해 주세요.');return;}
      push=d.has('push');pushTransaction=d.has('transaction');pushBudget=d.has('budget');
      quietHours=d.has('quiet');quietStart=options.from;quietEnd=options.to;
      accountMessage='알림 설정을 저장했습니다.';render();break;
  }
}

  start:()=>head('앱 시작','세션 확인 중')+notice('저장된 로그인과 장부 접근 권한을 확인하고 있습니다.'),
  offline:()=>head('앱 시작','연결을 확인해 주세요')+notice('네트워크 오류로 세션 확인을 마치지 못했습니다.','error')+btn('다시 시도','retry','primary')
};
const placeholders={'07-team':'팀 만들기','07-ledger':'장부 만들기','07-members':'장부 참여자','00-public':'참여 가능한 장부','06-join':'회원가입'};
const screenNames={'03':'거래 달력','08':'장부 결산','09':'영수증으로 기록','11':'증빙 갤러리','12':'알림','13':'내 계정','00':'팀·장부 선택','01':'홈','02':'거래 내역','04':'설정','05':'거래 상세','05-edit':'거래 수정','07':'목표 예산','10':'거래 등록'};
function render() {
  const nav=document.querySelector('.nav');
  const ledger=['01','02','03','04','05','05-edit','07','08','09','10','11','07-members'].includes(page);
  const mode=$('view').value;
  const active={'05':caller,'05-edit':caller,'07':'04','09':returnTo['09'],'10':formCaller,'11':'02'}[page]||page;
  const visibleNav=ledger&&mode!=='forbidden';
  nav.hidden=!visibleNav; nav.style.display=visibleNav?'':'none';
  document.querySelector('.layout').classList.toggle('with-nav',visibleNav);
  nav.innerHTML=[['03','달력'],['02','거래 내역'],['01','홈'],['08','결산'],['04','설정']].map(([id,label])=>btn(label,id==='03'||id==='08'?'sub:'+id:'go:'+id,id===active?'active':'')).join('');
  nav.querySelector('.active')?.setAttribute('aria-current','page');
  const unread=notifications.filter(n=>!n.read).length;
  $('context').innerHTML=visibleNav?'<div class="context-actions">'+btn('알림'+(unread?' '+unread:''),'sub:12','quiet')+btn('팀·장부 전환','go:00','quiet')+'</div>':page==='00'?btn('알림'+(unread?' '+unread:''),'sub:12','quiet'):'';
  if(mode!=='normal'&&screenNames[page]){
    const messages={loading:'정보를 불러오는 중입니다.',empty:page==='05'?'거래를 찾을 수 없습니다.':'표시할 결과가 없습니다.',error:'정보를 불러오지 못했습니다. 연결 상태를 확인해 주세요.',forbidden:'이 화면에 접근할 수 없습니다.'};
    screen.innerHTML=head(page,screenNames[page])+notice(messages[mode],mode==='error'?'error':'')+
      (mode==='loading'?'<div class="card" aria-hidden="true"><div class="placeholder short"></div><div class="placeholder"></div></div>':'')+
      (mode==='error'?btn('다시 시도','refresh','primary'):mode==='forbidden'?btn('팀·장부 선택','go:00'):mode==='empty'&&page==='05'?btn('원래 화면으로','origin'):'');
  } else screen.innerHTML=pages[page]?.()||outside(page.split('-')[0],placeholders[page]||'화면');
}
function submitTransaction(form) {
  const editing=page==='05-edit';
  if(locked() || (editing ? !writable() : formType==='in' && !admin())) return;
  const d=new FormData(form), before=editing?selected:null;
  const category=d.get('category'), amount=Number(d.get('amount'));
  const name=formType==='out'?String(d.get('merchant')).trim():category;
  const removed=d.getAll('remove').map(Number);
  const files=[...(before?.files||manualDraft?.files||[]).filter((_,i)=>!removed.includes(i)),...Array.from(form.elements.files.files,f=>f.name)];
  if(!name||!Number.isSafeInteger(amount)||amount<1||amount>1000000000||files.length>5){
    $('form-error').innerHTML=notice('거래처·금액(1원~10억 원)·증빙 개수(최대 5개)를 확인해 주세요.','error');return;
  }
  const record={id:before?.id||serial,type:formType,name,amount,category,date:d.get('date'),memo:d.get('memo'),depositor:d.get('depositor'),author:before?.author||(admin()?'김지우':'이하늘'),files};
  saveTransaction(record,before,formCaller);
}
function saveTransaction(record,before,origin,onCommit=()=>{}){
  const commit=()=>{
    if(locked())return;
    if(before) transactions=transactions.map(t=>t.id===record.id?record:t);
    else { serial++;transactions.unshift(record);caller=origin; }
    onCommit();selected=record;go('05');
  };
  const current=spent(), expected=current+(record.type==='out'?record.amount:0)-(before?.type==='out'?before.amount:0);
  if(budget.target!==null&&expected>current&&expected>budget.target){
    const summary=kv('현재 지출',money(current))+kv('저장 후 지출',money(expected))+kv('목표 예산',money(budget.target))+kv('초과액',money(expected-budget.target));
    if(budget.policy==='BLOCK') {
      const error=$('form-error');
      error.innerHTML=notice('예산 초과로 저장할 수 없습니다. 금액을 확인해 주세요.','error')+summary;
      error.scrollIntoView({block:'center'});
    }
    else modal('목표 예산을 초과합니다',summary,commit,'확인 후 저장');
    return;
  }
  commit();
}
function saveBudget(next,reason) {
  if(!editable()) return;
  const label=v=>v===null?'미설정':money(v);
  const changed=JSON.stringify(next)!==JSON.stringify(budget);
  const commit=()=>{
    if(changed) budgetHistory.unshift({change:label(budget.target)+' → '+label(next.target),reason});
    budget=next;budgetEditing=false;render();
  };
  if(next.target!==null&&spent()>next.target&&changed)
    modal('현재 지출이 새 목표 예산을 초과합니다',kv('확정 지출',money(spent()))+kv('새 목표 예산',money(next.target))+kv('초과액',money(spent()-next.target)),commit,'확인 후 저장');
  else commit();
}
function cancelForm() {
  const next=page==='05-edit'?'05':formCaller;
  if($('transaction')?.dataset.dirty) modal('입력을 폐기할까요?','<p>계속 작성하려면 취소를 선택하세요.</p>',()=>go(next),'폐기하고 돌아가기');
  else go(next);
}
document.addEventListener('click',e=>{
  const action=e.target.closest('[data-act]')?.dataset.act;
  if(!action) return;
  const [name,value]=action.split(':');
  const navigate=next=>{
    if(page==='02') listScroll=window.scrollY;
    if($('transaction')?.dataset.dirty) modal('입력을 폐기할까요?','<p>계속 작성하려면 취소를 선택하세요.</p>',next,'폐기하고 이동');
    else if($('budget-form')?.dataset.dirty) modal('예산 변경을 폐기할까요?','<p>계속 편집하려면 취소를 선택하세요.</p>',next,'폐기하고 이동');
    else next();
  };
  const handlers={
    go:()=>navigate(()=>go(value)),sub:()=>navigate(()=>openSub(value)),
    back:()=>go(previous||'01'),'picker-back':()=>go(pickerCaller||'01'),origin:()=>go(caller),
    record:()=>{if(locked()||page==='03'&&calendarDay>demoToday)return;manualDraft=null;formCaller=page;formType='out';if(page==='02')listScroll=window.scrollY;go('10');},
    tx:()=>{caller=page;if(page==='11')galleryScroll=window.scrollY;if(page==='02')listScroll=window.scrollY;selected=transactions.find(t=>t.id===Number(value));go('05');},
    edit:()=>{formType=selected.type;go('05-edit');},
    type:()=>{if(value!==formType)navigate(()=>{formType=value;render();});},
    'cancel-form':cancelForm,
    delete:()=>modal('이 거래를 삭제할까요?',`<p>${safe(selected.name)} · ${money(selected.amount)}</p><p>삭제 후 장부 잔액과 거래 목록이 갱신됩니다.</p>`,()=>{transactions=transactions.filter(t=>t.id!==selected.id);selected=null;go(caller);},'거래 삭제'),
    clear:()=>{filters={};render();},
    logout:()=>modal('로그아웃할까요?','<p>다시 사용하려면 로그인해 주세요.</p>',()=>{authMessage='로그아웃했습니다.';go('06');},'로그아웃'),
    'reset-done':()=>{authMessage='비밀번호 재설정이 완료되었습니다. 새 비밀번호로 로그인해 주세요.';go('06');},
    budget:()=>{budgetEditing=false;go('07');},
    'budget-edit':()=>{budgetEditing=true;render();$('budget-form').elements.amount.focus();},
    'budget-cancel':()=>navigate(()=>{budgetEditing=false;render();}),
    'budget-unset':()=>{
      const reason=$('budget-form').elements.reason.value.trim();
      if(!reason){$('budget-error').innerHTML=notice('예산 해제 사유를 입력해 주세요.','error');return;}
      modal('목표 예산을 해제할까요?',kv('기존 목표 예산',money(budget.target))+'<p>예산 소진율과 초과 정책 적용이 중지됩니다. 거래와 잔액은 보존됩니다.</p>',()=>saveBudget({...budget,target:null},reason),'미설정으로 전환');
    },
    retry:()=>startup(true),refresh:()=>go(page)
  };
  if(handlers[name])handlers[name]();else extensionClick(name,value,navigate);
});
document.addEventListener('input',e=>{
  if(['transaction','budget-form'].includes(e.target.form?.id))e.target.form.dataset.dirty='true';
});
document.addEventListener('submit',e=>{
  const form=e.target;
  e.preventDefault();
  if(form.id==='login'){context=$('scenario').value;enter();}
  if(form.id==='filters'){
    const next=Object.fromEntries(new FormData(form));
    if(next.from&&next.to&&next.from>next.to){form.querySelector('details').open=true;$('filter-error').innerHTML=notice('종료일은 시작일 이후로 선택해 주세요.','error');return;}
    filters=next;listScroll=0;render();
  }
  if(form.id==='transaction')submitTransaction(form);
  if(form.id==='budget-form'){
    const d=new FormData(form), reason=String(d.get('reason')).trim(), target=Number(d.get('amount'));
    if(target!==budget.target&&!reason){$('budget-error').innerHTML=notice('예산 금액 변경 사유를 입력해 주세요.','error');return;}
    saveBudget({target,policy:d.get('policy'),warning:d.has('warning'),critical:d.has('critical')},reason);
  }
  if(['settlement-form','gallery-filter','ocr-upload','ocr-review','otp-form','lock-form','preferences-form'].includes(form.id))extensionSubmit(form);
});
$('restart').onclick=()=>startup();
$('view').onchange=()=>render();
$('role').onchange=()=>{
  if(page==='10' && !admin()) formType='out';
  render();
};
$('preset').onchange=()=>{setPreset();render();};
startup();
</script>
</html>
